<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Habit Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Habit Tracker</h1>
  <ul>
  {% for habit in habits %}
    <li>
      <form method="post" action="{{ url_for('toggle', habit_id=habit.id) }}">
        <button type="submit">{{ "✓" if habit.done else "○" }}</button>
        {{ habit.name }}
      </form>
    </li>
  {% endfor %}
  </ul>
</body>
</html>
