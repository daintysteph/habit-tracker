<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Habit Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Habit Tracker</h1>
  <ul>
  {% for habit in habits %}
    <li>
      <form method="post" action="{{ url_for('toggle', habit_id=habit.id) }}">
        <button type="submit" class="{{ 'done' if habit.done else '' }}">{{ "✓" if habit.done else "○" }}</button>
        {{ habit.name }}
      </form>
      <form method="post" action="{{ url_for('delete', habit_id=habit.id) }}" class="remove">
          <button type="submit" class="delete" aria-label="Delete {{ habit.name }}">✕</button>
          <span class="streak">{{ habit.streak }} day streak</span>
      </form>
    </li>
  {% endfor %}
  </ul>
<form method="post" action="{{ url_for('add') }}" class="add">
  <input type="text" name="name" placeholder="New habit" required>
  <button type="submit" class="plus">+</button>
</form>  
</body>
</html>
